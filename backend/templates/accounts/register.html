<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Healthcare - Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef5ff;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            width: 360px;
            max-width: calc(100% - 48px);
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 8px 28px #00000015;
        }
        h1 { color: #1261a0; text-align: center; }
        p { text-align: center; color: #555; }
        label { display: block; margin-top: 14px; }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #ccd5e0;
            border-radius: 7px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #1261a0;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }
        .messages { color: #c62828; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Smart Healthcare</h1>
        <p>Create your patient account</p>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Full Name</label>
            <input type="text" name="full_name" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Password</label>
            <input type="password" name="password" minlength="8" required>

            <label>Confirm Password</label>
            <input type="password" name="confirm_password" minlength="8" required>

            <button type="submit">Create Account</button>
        </form>
    </div>
</body>
</html>
